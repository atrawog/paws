# Properly override MediaWiki authentication with DummyAuthenticator
localdev:
  enabled: false

pawsPublicEnabled: false
minesweeper:
  enabled: false

paws:
  frontPageEnabled: false

jupyterhub:
  hub:
    config:
      DummyAuthenticator:
        password: admin
      JupyterHub:
        authenticator_class: dummy
    
    # Override the extraConfig that sets MediaWiki auth
    extraConfig:
      # Keep the original configs but override the authenticator
      00-myConfig: |
        localdev = False
      10-myConfig: |
        # Override with empty config to prevent MediaWiki auth
        pass
      20-dummy-auth: |
        # Force DummyAuthenticator after all other configs
        from jupyterhub.auth import DummyAuthenticator
        c.JupyterHub.authenticator_class = DummyAuthenticator
        c.DummyAuthenticator.password = 'admin'
        print("Forced DummyAuthenticator override applied")
    
    db:
      type: sqlite-memory
    networkPolicy:
      enabled: false
    image:
      name: quay.io/jupyterhub/k8s-hub
      tag: "3.3.8"
    
  proxy:
    service:
      type: NodePort
    chp:
      networkPolicy:
        enabled: false
      image:
        name: quay.io/jupyterhub/configurable-http-proxy
        tag: "4.6.1"
  
  singleuser:
    image:
      name: quay.io/jupyterhub/k8s-singleuser-sample
      tag: "3.3.8"
    storage:
      type: none
    networkPolicy:
      enabled: false
    cpu:
      limit: 0.5
      guarantee: 0.1
    memory:
      limit: 512M
      guarantee: 256M
  
  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: false
  
  scheduling:
    userScheduler:
      enabled: false
    podPriority:
      enabled: false
    userPlaceholder:
      enabled: false
  
  debug:
    enabled: false
  
  ingress:
    enabled: false